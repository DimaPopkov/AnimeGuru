<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Соединение с Discord | AnimeGuru</title>
    <!-- Подключаем шрифт и иконки -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #161925;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --discord-color: #5865F2;
            --discord-hover: #4752C4;
            --border-color: #23283b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background-color: rgba(88, 101, 242, 0.1);
            color: var(--discord-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 20px;
            overflow: hidden;
        }
        
        .icon-wrapper img {
            width: 145px;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
            margin: 0 0 28px 0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-confirm {
            background-color: var(--discord-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-confirm:hover {
            background-color: var(--discord-hover);
        }

        .btn-confirm:active {
            transform: scale(0.98);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="icon-wrapper">
            <i class="fa-brands fa-discord"></i>
            <img src='https://e7.pngegg.com/pngimages/5/969/png-clipart-discord-round-logo-tech-companies.png'>
        </div>
        
        <h2>Соединение с Discord</h2>
        <p>Вы собираетесь безопасно подключить ваш профиль Discord к игровому аккаунту <strong>AnimeGuru</strong>.</p>

        <!-- Интеграция с логикой Django-Allauth -->
        <form method="post" action="">
            {% csrf_token %}

            {% if form %}
                {{ form.as_hidden }}
            {% endif %}

            <button class="btn-confirm" type="submit">
                <i class="fa-brands fa-discord"></i>
                Продолжить
            </button>
            <a href="/profile/" class="btn-cancel">Отмена</a>
        </form>
    </div>
</div>

</body>
</html>
