<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка авторизации | AnimeGuru</title>
    <style>
        body { font-family: sans-serif; background-color: #0f111a; color: #f3f4f6; padding: 40px; text-align: center; }
        .error-box { background: #161925; border: 1px solid #23283b; padding: 30px; border-radius: 12px; max-width: 600px; margin: 0 auto; }
        .tech-error { background: #1a1016; border: 1px solid #441a22; color: #f87171; padding: 15px; border-radius: 6px; font-family: monospace; text-align: left; margin-top: 20px; }
        a { color: #5865F2; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="error-box">
    <h2>❌ Ошибка входа через внешний сервис</h2>
    <p>Произошла ошибка при попытке связать аккаунт Discord.</p>
    
    <!-- Код вывода технической ошибки из Allauth -->
    <div class="tech-error">
        <strong>Технический код ошибки:</strong> {{ auth_error.code }}<br>
        <strong>Описание:</strong> {{ auth_error.exception }}
    </div>

    <p style="margin-top: 30px;"><a href="/profile/">Вернуться в профиль</a></p>
</div>

</body>
</html>
